<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3-Column Grid Layout</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      .page-container {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      .screen-section {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      }

      .content-wrapper {
        width: 100%;
        max-width: 1200px;
      }

      .grid-layout {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 2rem;
      }

      .sticky-header {
  position: sticky;
  top: 0;
}

      .card {
        width: 100%;
    max-width: 400px;
    padding: 2rem;
    border-radius: 8px;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    background-color: #f4f4f4;
    text-align: center;
      }

      @media (max-width: 768px) {
        .grid-layout {
          grid-template-columns: 1fr;
        }

        .screen-section {
          padding: 4rem 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <header class="sticky-header">
      <h1>Responsive Screens</h1>
    </header>
    <section class="screen-section hero-section">
      <div class="content-wrapper">
        <h1>Screen One: Hero</h1>
        <p>
          This fills the viewport initially on desktop and adapts on mobile.
        </p>
      </div>
    </section>

    <section class="screen-section feature-section">
      <div class="content-wrapper grid-layout">
        <div class="card">Feature A</div>
        <div class="card">Feature B</div>
      </div>
    </section>

    <section class="screen-section footer-section">
      <div class="content-wrapper">
        <h2>Screen Three: Conclusion</h2>
        <button>Get Started</button>
      </div>
    </section>
  </body>
</html>
